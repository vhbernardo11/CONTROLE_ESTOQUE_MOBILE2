name: Build Cardapio APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
        working-directory: cardapio-armazem-app

      - name: Prepare file
        run: cp cardapio-armazem-app/app/build/outputs/apk/debug/app-debug.apk Armazem-Cardapio-Digital.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: armazem-cardapio-apk
          path: Armazem-Cardapio-Digital.apk
          if-no-files-found: error
          retention-days: 7
